name: Container security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: HIGH/CRITICAL scan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: mongo-express:ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fresh image
        run: docker build --pull --no-cache --platform "linux/${{ matrix.arch }}" -t "$IMAGE" .
      - name: Scan OS and application packages; block HIGH and CRITICAL
        id: scan
        run: bash scripts/scan-image.sh "$IMAGE"
      - name: Upload scan reports, including failures
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-${{ matrix.arch }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 30

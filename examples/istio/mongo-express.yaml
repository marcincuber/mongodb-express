apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-express-config
  namespace: mongo-express-istio
data:
  VCAP_APP_HOST: "0.0.0.0"
  PORT: "8081"
  ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
  ME_CONFIG_MONGODB_AWS_DOCUMENTDB: "true"
  ME_CONFIG_MONGODB_TLS: "true"
  # Upstream maps this to tlsAllowInvalidCertificates. Keep validation enabled.
  ME_CONFIG_MONGODB_TLS_ALLOW_CERTS: "false"
  ME_CONFIG_MONGODB_TLS_CA_FILE: /certs/global-bundle.pem
  ME_CONFIG_BASICAUTH_ENABLED: "true"
  ME_CONFIG_SITE_BASEURL: /
  ME_CONFIG_HEALTH_CHECK_PATH: /status
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: mongo-express-istio
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
        # Istio provides ingress; the app connects directly to DocumentDB.
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo-express
          # Replace with the unique image URI from the README's ECR build steps.
          image: 123456789012.dkr.ecr.eu-west-2.amazonaws.com/mongo-express:1.1.0-rc-4-20261116T120000Z-a1b2c3d4e5f6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: mongo-express-config
            - secretRef:
                name: mongo-express-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Keep liveness independent of temporary database failures.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: documentdb-ca
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: documentdb-ca
          configMap:
            name: documentdb-ca
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: mongo-express-istio
spec:
  type: ClusterIP
  selector:
    app: mongo-express
  ports:
    - name: http
      port: 8081
      targetPort: http
